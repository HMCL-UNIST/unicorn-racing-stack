#!/usr/bin/env python
# Reorganized into collapsible groups (GGV / Bridge / Safety /
# Raceline / Sectors / VelOpt / FBGA) with concise English
# descriptions for rqt_reconfigure tooltips.
# rqt rendering order is the order of gen.add(...) / gen.add_group(...)
# below. Top-level triggers (apply / save_ggv) render first, then groups
# in declaration order.
PACKAGE = "stack_master"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ========== Top-level triggers (rendered above all groups) ==========
# Pipeline triggers — `apply` runs the full pipeline (GGV / raceline /
# vel_engine stages as enabled by the checkboxes in their groups).
# `save_ggv` (renamed from save_now) snapshots the current latest GGV to
# v<N+1> independently of apply.
gen.add("apply", bool_t, 0,
        "Run pipeline (auto-cleared after trigger)",
        False)
gen.add("save_ggv", bool_t, 0,
        "Snapshot current latest GGV to v<N+1> (independent of apply)",
        False)

# ========== GGV group ==========
# alphabetical prefix (A_, B_, …) forces rqt's alphabetical group
# sort to match the intended logical order. Numeric prefixes are
# rejected — ROS naming convention requires names to start with a
# letter.
ggv = gen.add_group("A_GGV", state=True)

# Grip scales (lap-time dominant)
ggv.add("lambda_mu_x", double_t, 0,
        "Longitudinal grip scale (straight accel/brake limit)",
        1.0, 0.2, 2.5)
ggv.add("lambda_mu_y", double_t, 0,
        "Lateral grip scale (corner speed limit)",
        1.0, 0.2, 2.5)

# Power / top speed
ggv.add("P_max", double_t, 0,
        "Motor max power [W]",
        300.0, 50.0, 1000.0)
ggv.add("v_max", double_t, 0,
        "Absolute top speed [m/s]",
        15.0, 4.0, 15.0)

# Combined slip shape (load dependence)
ggv.add("p_Dx_2", double_t, 0,
        "Long. load sensitivity (0=optimistic, negative=conservative)",
        0.0, -1.0, 1.0)
ggv.add("p_Dy_2", double_t, 0,
        "Lat. load sensitivity (0=optimistic, negative=conservative)",
        0.0, -1.0, 1.0)
# friction — split into longitudinal (x) and lateral (y)
ggv.add("p_Dx_1", double_t, 0,
        "Longitudinal peak friction (accel/brake limit)",
        1.0, 0.3, 1.5)
ggv.add("p_Dy_1", double_t, 0,
        "Lateral peak friction (cornering limit)",
        1.0, 0.3, 1.5)

# Vehicle behavior
ggv.add("epsilon", double_t, 0,
        "Roll stiffness split (0.5=neutral, <0.5=OS, >0.5=US)",
        0.5, 0.3, 0.7)

# NLP caps (0 = unlimited)
ggv.add("P_brake_max", double_t, 0,
        "Brake power cap [W] (0=unlimited, F_brake*V <= cap)",
        300.0, 50.0, 1000.0)
ggv.add("ax_max_cap", double_t, 0,
        "Accel cap [m/s^2] (0=unlimited)",
        0.0, 0.0, 10.0)
ggv.add("ax_min_cap", double_t, 0,
        "Decel cap [m/s^2] (positive value, 0=unlimited)",
        0.0, 0.0, 10.0)
ggv.add("ay_max_cap", double_t, 0,
        "Lateral accel cap [m/s^2] (0=unlimited)",
        0.0, 0.0, 10.0)

# Diamond post-processing scales (1.0 = NLP as-is, no-op)
ggv.add("gg_exp_scale", double_t, 0,
        "Diamond exponent scale (1.0=NLP, <1=diamond-like, >1=circular)",
        1.0, 0.5, 1.5)
ggv.add("ax_max_scale", double_t, 0,
        "Diamond ax_max scale (1.0=NLP, <1=reduce accel envelope)",
        1.0, 0.5, 1.5)
ggv.add("ax_min_scale", double_t, 0,
        "Diamond ax_min scale (1.0=NLP, <1=reduce decel envelope)",
        1.0, 0.5, 1.5)
ggv.add("ay_scale", double_t, 0,
        "Diamond ay_max scale (1.0=NLP, <1=slower corners)",
        1.0, 0.5, 1.5)

# Pipeline control (GGV stage)
ggv.add("run_ggv", bool_t, 0,
        "Regenerate GGV (False=reuse existing latest)",
        True)
ggv.add("full_resolution", bool_t, 0,
        "GGV full resolution (True=precise/slow, False=fast)",
        False)
# per-group Apply mirror — same effect as root `apply`, just placed at
# the bottom of this group so user doesn't have to scroll back to root.
ggv.add("apply_ggv", bool_t, 0,
        "Apply (same as root `apply`, mirrored here for convenience)",
        False)

# ========== Bridge group ==========
# Bridge centerline / heading-lock group.
# Defines bridge zones (start/end indices only) on the
# *smoothed centerline CSV* (pre-optimization). Tuning knobs
# (pre_m, post_m, chi_max_rad, force_center) are GLOBAL — applied to
# every bridge in the yaml — and live here in rqt so they can be
# tweaked without reopening the GUI. The yaml stores positions only;
# this matches the established sector-tuner pattern (GUI marks
# *positions*, rqt tunes *parameters*). Missing yaml ⇒ silent no-op
# (tracks without bridges work unchanged).
bridge = gen.add_group("B_Bridge", state=True)
bridge.add("run_bridge_tuner", bool_t, 0,
           "Spawn/kill bridge_sector_tuner_3d GUI for the selected map. "
           "GUI marks bridge zones (pairs of Select-S clicks) and writes "
           "<map>/bridge_sectors.yaml with start/end indices only.",
           False)
bridge.add("bridge_constraints_enable", bool_t, 0,
           "Apply bridge constraints from <map>/bridge_sectors.yaml during "
           "raceline regen. Missing yaml ⇒ no-op (no error).",
           True)
# global tuning applied to every bridge in the yaml.
bridge.add("bridge_pre_m", double_t, 0,
           "Extend the bridge constraint zone BEFORE each bridge's start by "
           "this many meters of s. 0 = no extension. Applied to every bridge.",
           0.0, 0.0, 5.0)
bridge.add("bridge_post_m", double_t, 0,
           "Extend the bridge constraint zone AFTER each bridge's end by "
           "this many meters of s. 0 = no extension. Applied to every bridge.",
           0.0, 0.0, 5.0)
bridge.add("bridge_force_center", bool_t, 0,
           "Pin the racing line to track center (n ≈ 0) inside every bridge "
           "zone. Safety distance is automatically satisfied.",
           False)
bridge.add("bridge_chi_max_rad", double_t, 0,
           "Bound |chi| (heading vs centerline) below this value inside every "
           "bridge zone. <0 disables (no heading constraint). 0 = strictly "
           "parallel to bridge longitudinal direction.",
           0.0, -1.0, 0.7854)  # max ≈ π/4
bridge.add("apply_bridge", bool_t, 0,
           "Apply (same as root `apply`, mirrored here for convenience)",
           False)

# ========== Safety group ==========
# Safety sector group — 3 independent checkboxes.
# 1) safety_sector_tuner : trigger (bridge pattern) that spawns the
# slicing GUI only. Auto-clears after spawn. Marks sectors → yaml.
# 2) safety_sector_setting : persistent toggle that spawns the dyn
# cfg server (sliders in /dyn_sector_tuner/safety) so the user can
# live-tune per-sector safety_distance and save_params to yaml.
# 3) safety_sector_use : raceline application switch. ON ⇒ raceline
# reads per-sector values (rosparam if server up, else yaml).
# OFF ⇒ uniform safety_distance (legacy).
safety = gen.add_group("C_Safety", state=True)
safety.add("safety_sector_tuner", bool_t, 0,
           "Trigger: spawn safety slicing GUI only (marks sectors → yaml). "
           "Auto-clears after spawn.",
           False)
safety.add("safety_sector_setting", bool_t, 0,
           "ON ⇒ spawn dyn cfg server (sliders appear in "
           "/dyn_sector_tuner/safety; live-tune + save_params to yaml). "
           "OFF ⇒ kill server.",
           False)
safety.add("safety_sector_use", bool_t, 0,
           "Apply per-sector safety_distance during raceline regen. "
           "Live rosparam (if setting=ON) takes precedence over yaml; "
           "OFF ⇒ uniform safety_distance everywhere (legacy).",
           False)
safety.add("apply_safety", bool_t, 0,
           "Apply (same as root `apply`, mirrored here for convenience)",
           False)

# ========== Raceline group ==========
raceline = gen.add_group("D_Raceline", state=True)

raceline.add("regen_raceline", bool_t, 0,
             "Re-optimize raceline (start_from=5)",
             False)
raceline.add("map", str_t, 0,
             "Map name (required for raceline regen; maps/<name>/)",
             "eng_")
raceline.add("safety_distance", double_t, 0,
             "Track wall margin [m] (reduce for narrow tracks)",
             0.20, 0.05, 0.50)
raceline.add("V_min", double_t, 0,
             "Raceline minimum speed [m/s] (0=unlimited)",
             1.0, 0.0, 5.0)
raceline.add("w_T", double_t, 0,
             "Time weight (1=min-time optimization)",
             1.0, 0.0, 10.0)
raceline.add("w_jx", double_t, 0,
             "Longitudinal jerk weight (higher=smoother accel/brake)",
             0.01, 0.0, 1.0)
raceline.add("w_jy", double_t, 0,
             "Lateral jerk weight (higher=smoother cornering)",
             0.01, 0.0, 1.0)
raceline.add("w_dOmega_z", double_t, 0,
             "Curvature weight (higher=flatter line)",
             0.0, 0.0, 10.0)
# per-group Apply mirror
raceline.add("apply_raceline", bool_t, 0,
             "Apply (same as root `apply`, mirrored here for convenience)",
             False)

# ========== Sector slicing group ==========
# sector_slicing — checkbox spawns 3d_sector_slicing.launch
# (speed/ot/static_obs sector slicers) for the selected map.
# trigger-style — auto-clears after spawning. Close the GUI windows
# directly to terminate; the box does NOT kill on uncheck (avoids
# stale-True confusion across sessions).
sectors = gen.add_group("E_Sectors", state=True)
sectors.add("run_sector_slicing", bool_t, 0,
            "Trigger: spawn 3d_sector_slicing.launch for the selected map. "
            "Auto-clears after spawn. Close GUI windows to terminate.",
            False)
# apply_new_sectors — kill+respawn 5 sector nodes (speed/overtake/
# static_obs server + velocity_scaler + ot_interpolator) so new
# sector yamls take effect without restarting 3d_base_system.
sectors.add("apply_new_sectors", bool_t, 0,
            "Trigger: kill+respawn 5 sector nodes via 3d_sector_respawn.launch. "
            "Auto-clears. Use after sector slicing GUI saved new yamls.",
            False)

# ========== Stage 4 vel engine selector ==========
# single selector replaces run_fbga (bool). Only one engine publishes
# /global_waypoints at a time → publisher conflict prevented.
# Wrapped in a single-row Stage4 group so its render position stays
# between Sectors and VelOpt — root params get pulled above all groups
# by dynamic_reconfigure, breaking the intended order.
stage4 = gen.add_group("F_vel_engine", state=True)
vel_engine_enum = gen.enum([
    gen.const("none",   str_t, "none",   "Stage 4 disabled"),
    gen.const("fbga",   str_t, "fbga",   "FBGA forward/backward (C++ binary)"),
    gen.const("velopt", str_t, "velopt", "3d_optimized_vel_planner NLP"),
], "Stage 4 velocity engine selector")
stage4.add("vel_engine", str_t, 0,
           "Stage 4 engine: none / fbga / velopt",
           "none", edit_method=vel_engine_enum)

# ========== VelOpt group (3d_optimized_vel_planner NLP) ==========
# NLP knobs + separate bridge_effect (can differ from the fbga value).
# Defaults / ranges restored from original GGTuner3D.cfg.
# Param names shortened (velopt_* → vo_*) for rqt readability;
# legacy w_jx_curv_alpha slider dropped (use alpha_acc/_brk + beta_acc/_brk).
velopt = gen.add_group("G_VelOpt", state=True)
# VelOpt-only save/load — dump/restore ONLY the vo_* sliders to a
# per-map single file at stack_master/maps/<map>/velopt_params.yml
# (overwritten on each save, no version history). Map is read from the
# D_Raceline `map` slider. Auto-clears after handling.
# Placed at top of G_VelOpt group for proximity to the vo_* sliders.
velopt.add("save_velopt_params", bool_t, 0,
           "Save ONLY vo_* sliders to maps/<map>/velopt_params.yml "
           "(auto-cleared after trigger)",
           False)
velopt.add("load_velopt_params", bool_t, 0,
           "Load maps/<map>/velopt_params.yml into vo_* sliders "
           "(auto-cleared after trigger)",
           False)
velopt.add("vo_bridge", double_t, 0,
           "VelOpt bridge_effect (Track3D g_weight, independent of fbga). "
           "1=physics, higher=more conservative.",
           1.0, 0.0, 5.0)
velopt.add("vo_Vmin", double_t, 0,
           "VelOpt min speed bound [m/s]",
           1.0, 0.0, 5.0)
velopt.add("vo_gg_marg", double_t, 0,
           "VelOpt GGV shrink margin (0.0=full grip)",
           0.0, 0.0, 0.5)
# velopt_step_size removed from rqt (fixed at velopt node default 0.2 m)
velopt.add("vo_w_T", double_t, 0,
           "VelOpt time weight (1.0=min-time; higher=more aggressive). "
           "Range extended to 50; V saturates at GG V_max as w_T grows.",
           1.0, 0.0, 50.0)
velopt.add("vo_w_jx", double_t, 0,
           "VelOpt jerk regularization base (higher=smoother accel/brake). "
           "Range tightened to 0~0.1 for fine slider control "
           "(text input still accepts any value).",
           0.01, 0.0, 0.5)
# asymmetric jerk + corner-only smoothing (multiplied with w_jx).
# ratio=1, alpha=0 → identical to legacy symmetric behavior.
velopt.add("vo_acc_r", double_t, 0,
           "VelOpt accel-side jerk weight ratio (>1 = smoother accel)",
           1.0, 0.0, 10.0)
velopt.add("vo_brk_r", double_t, 0,
           "VelOpt brake-side jerk weight ratio "
           "(>1 = smoother brake → earlier brake onset)",
           1.0, 0.0, 10.0)
# tanh-saturated curvature/transition weighting (alpha corner + beta transition).
# curv_factor = (1 + alpha*tanh(|Omega|/k_alpha) + beta*tanh(|dOmega/ds|/k_beta))
# for acc/brk side. All zeros → identical to legacy. alpha/beta saturate
# (sublinear) so strong corners don't get over-penalized vs weak corners.
velopt.add("vo_alpha_acc", double_t, 0,
           "[-] alpha gain for accel-side jerk in corner "
           "(saturates at 1+alpha via tanh(|Omega_z|/k_alpha))",
           0.0, 0.0, 5.0)
velopt.add("vo_alpha_brk", double_t, 0,
           "[-] alpha gain for brake-side jerk in corner",
           0.0, 0.0, 5.0)
velopt.add("vo_k_alpha", double_t, 0,
           "[1/m] alpha tanh saturation scale "
           "(smaller=earlier saturation; |Omega_z|=k_alpha -> 76% activation)",
           0.2, 0.05, 2.0)
velopt.add("vo_beta_acc", double_t, 0,
           "[-] beta gain for accel-side jerk in transition zone "
           "(|dOmega_z/ds|-weighted, sharp entries/exits only)",
           0.0, 0.0, 10.0)
velopt.add("vo_beta_brk", double_t, 0,
           "[-] beta gain for brake-side jerk in transition zone "
           "(catches sharp brake onset before steady corner)",
           0.0, 0.0, 10.0)
velopt.add("vo_k_beta", double_t, 0,
           "[1/m^2] beta tanh saturation scale for |dOmega_z/ds|",
           0.5, 0.001, 5.0)
# direct ax_pos^2 penalty in corners. Catches steady-state corner
# acceleration that jerk weighting cannot see (jx=0 once ax is constant).
# Independent k from k_alpha so this can be tuned without touching the
# jerk profile. w * tanh(|Omega_z|/k_axc) * max(ax,0)^2 in L_reg.
velopt.add("vo_w_axc", double_t, 0,
           "[-] direct ax_pos^2 weight in corners "
           "(w * tanh(|Omega_z|/k_axc) * max(ax,0)^2). 0 = off.",
           0.0, 0.0, 10.0)
velopt.add("vo_k_axc", double_t, 0,
           "[1/m] ax_pos corner tanh saturation scale "
           "(smaller=earlier saturation; |Omega_z|=k_axc -> 76% activation)",
           0.2, 0.001, 5.0)
# per-point friction scaling (multiply base ax_max/ay_max/ax_min by
# friction_sector mu). When True, multi-GGV (separate <base>_fNNN
# directories) is bypassed and the *base* GGV is scaled in-NLP by
# mu_scale_k[k] from /friction_map_params/Sector{i}/friction. This
# avoids needing per-friction GGV regenerations for short bridge
# patches — scaling a 2 m segment by 0.6 friction inside the NLP is
# far cheaper than precomputing a new GG diagram for it.
velopt.add("vo_use_friction_scaling", bool_t, 0,
           "Scale base GGV (ax_max/ay_max/ax_min) per-point by friction "
           "sector mu inside the NLP. Bypasses multi-GGV directory lookup. "
           "Recommended True for short friction patches (e.g., 2m bridges).",
           False)
# per-direction extra scale on top of the friction-sector mu.
# Friction is theoretically isotropic (same μ in x and y), but in
# practice longitudinal vs lateral grip can degrade differently on a
# bridge / wet patch (e.g. lateral often drops earlier than
# longitudinal). The friction_sector mu stays as-is (absolute μ);
# these extra factors multiply the (ax_min, ax_max) and ay_max
# envelopes independently. Default 1.0 = identical x/y scaling = legacy
# behavior. Only applied when vo_use_friction_scaling is True.
# velopt.add("vo_mu_scale_x", double_t, 0,
#            "Extra longitudinal (ax_min, ax_max) scale on top of friction "
#            "sector mu. 1.0 = use sector mu as-is. <1 reduces accel/brake "
#            "envelope further. Only active when vo_use_friction_scaling=True.",
#            1.0, 0.5, 1.5)
# velopt.add("vo_mu_scale_y", double_t, 0,
#            "Extra lateral (ay_max) scale on top of friction sector mu. "
#            "1.0 = use sector mu as-is. <1 reduces cornering envelope further. "
#            "Only active when vo_use_friction_scaling=True.",
#            1.0, 0.5, 1.5)
# per-group Apply mirror
velopt.add("apply_velopt", bool_t, 0,
           "Apply (same as root `apply`, mirrored here for convenience)",
           False)

# ========== Friction group ==========
# Friction sector group — clone of Safety pattern.
friction = gen.add_group("H_Friction", state=True)
friction.add("friction_sector_tuner", bool_t, 0,
             "Trigger: spawn friction slicing GUI. Auto-clears.",
             False)
friction.add("friction_sector_setting", bool_t, 0,
             "ON ⇒ spawn dyn cfg server. OFF ⇒ kill.",
             False)
friction.add("apply_friction", bool_t, 0,
             "Apply (mirror of root `apply`).",
             False)

# ========== FBGA group ==========
fbga = gen.add_group("I_FBGA", state=True)

fbga.add("enable_mu", bool_t, 0,
         "FBGA mu compensation (True=use pitch/slope, False=g_tilde only)",
         True)
# bridge_effect (renamed from g_weight, matches 2.5d_vel_planner slope_correction)
# sin(mu)*N scaling on C++ FBGA ax_gravity. 1=physics, higher=more conservative.
fbga.add("bridge_effect", double_t, 0,
         "Slope ax_grav scale (1=physics, higher=more conservative). "
         "Same role as 2.5d_vel_planner slope_correction.",
         1.0, 0.0, 5.0)
fbga.add("g_tilde_soft_beta", double_t, 0,
         "softplus floor sharpness for g_tilde (1/beta m/s^2)",
         20.0, 1.0, 100.0)
fbga.add("smooth_mu", bool_t, 0,
         "SG filter on mu / dmu_ds (kills cm-scale PCD noise)",
         True)
fbga.add("mu_smooth_window", int_t, 0,
         "SG window length for mu (odd)",
         21, 5, 51)
fbga.add("mu_smooth_polyorder", int_t, 0,
         "SG polynomial order for mu",
         3, 1, 5)
fbga.add("smooth_kappa", bool_t, 0,
         "SG filter on kappa for vel calc only (path preserved)",
         True)
fbga.add("kappa_smooth_window", int_t, 0,
         "SG window length for kappa (odd)",
         21, 5, 51)
fbga.add("kappa_smooth_polyorder", int_t, 0,
         "SG polynomial order for kappa",
         3, 1, 5)
fbga.add("slope_brake_margin", double_t, 0,
         "Pre-slope braking distance [m] (0=off)",
         0.0, 0.0, 10.0)
fbga.add("slope_brake_vmax", double_t, 0,
         "Pre-slope Vmax cap [m/s]",
         5.0, 0.5, 15.0)
# per-group Apply mirror
fbga.add("apply_fbga", bool_t, 0,
         "Apply (same as root `apply`, mirrored here for convenience)",
         False)

exit(gen.generate(PACKAGE, "gg_tuner", "GGTuner"))
