#!/usr/bin/env python
# Live tuning of standing-start launch parameters via rqt_reconfigure.
PACKAGE = "stack_master"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# save/load triggers (mirrors controller.cfg pattern).
# Toggle in rqt_reconfigure → simple_mux dumps to (or loads from)
# stack_master/config/<CAR_NAME>/devices/launch_control.yaml, then resets the
# bool back to False. Same yaml path as launch_profile arg, so round-trip works.
gen.add("save_params", bool_t, 1, "Save current params to launch_control.yaml", False)
gen.add("load_params", bool_t, 1, "Reload params from launch_control.yaml",     False)

# profile shape selector (backward compat: CONSTANT == v1 single-knob)
mode_enum = gen.enum([
    gen.const("CONSTANT", int_t, 0, "Flat current = launch_current_A (v1)"),
    gen.const("CURVE",    int_t, 1, "4-phase exponential profile (v2)"),
], "launch profile shape")

gen.add("launch_profile_mode", int_t, 0,
        "CONSTANT keeps v1 single-knob behavior. CURVE uses the 4-phase exp profile.",
        1, 0, 1, edit_method=mode_enum)

# v1 (CONSTANT) parameter — kept for backward compat
gen.add("launch_current_A", double_t, 0,
        "[CONSTANT mode] Flat motor current held during launch window [A].",
        15.0, 0.0, 80.0)

# v2 (CURVE) parameters — exponential 4-phase profile
# Phase 1: 0 -> t_back, linear 0 -> I_back   (backlash absorb)
# Phase 2: t_back -> t_rise_end, exp rise I_back -> I_peak with tau   (weight transfer)
# Phase 3: t_rise_end -> t_total, plateau I_peak                       (traction-limited hold)
gen.add("launch_I_back", double_t, 0,
        "[CURVE] Phase 1 end / phase 2 start current [A]. Backlash absorption target.",
        30.0, 0.0, 80.0)
gen.add("launch_I_peak", double_t, 0,
        "[CURVE] Phase 2 target / phase 3 plateau current [A]. Final torque level.",
        75.0, 0.0, 80.0)
gen.add("launch_t_back", double_t, 0,
        "[CURVE] Phase 1 end time [s]. Linear ramp from 0 to launch_I_back.",
        0.05, 0.01, 0.30)
gen.add("launch_t_rise_end", double_t, 0,
        "[CURVE] Phase 2 end time [s]. Exp rise to launch_I_peak finishes by here.",
        0.30, 0.05, 0.80)
gen.add("launch_tau", double_t, 0,
        "[CURVE] Exp rise time constant [s]. Smaller=more aggressive ramp (chassis pitch tau).",
        0.08, 0.01, 0.50)

# Launch active window length (shared by CONSTANT and CURVE)
gen.add("launch_t_total", double_t, 0,
        "Launch active duration [s]. After this, mux hands off to controller speed PID.",
        1.0, 0.05, 2.0)

# Post-launch handoff safety
gen.add("launch_safety_floor_margin", double_t, 0,
        "Speed floor margin above measured for 100ms after launch ends [m/s].",
        0.1, 0.0, 1.0)

# recording toggle for CSV/PNG debug capture of START / launch_active windows.
# Default OFF so production runs do zero disk I/O and zero trigger evaluation.
# Flipping True lazily creates launch_logs/session_<ts>/ on first toggle.
# Falling edge does NOT cut an in-progress session — it just stops new ones being opened.
gen.add("enable_recording", bool_t, 1,
        "Record CSV+PNG for START / launch_active windows (debug). Default OFF.",
        False)

exit(gen.generate(PACKAGE, "simple_mux", "SimpleMux"))
