#!/usr/bin/env python3
# per-mode FBGA tuner.
# - v_scale  : output vx_mps multiplier. Slider only stages a pending value.
# - gg_scale : GGV ax_max/ay_max multiplier. Slider only stages a pending value.
# - apply    : commits ALL modes' pending v_scale AND gg_scale in one batch
# (gg commit triggers per-runner refresh_from_disk). Nothing is
# applied while dragging sliders; only apply takes effect.
# - save_param / load_param : dump / restore current values via
# stack_master/maps/<map>/fbga_tuner.yaml.
PACKAGE = "state_machine"
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

## -- per-mode v_scale (pending until apply) -------------------------
gen.add("recovery_v_scale",         double_t, 0, "RECOVERY output vx_mps multiplier (pending)",        1.0, 0.1, 2.0)
gen.add("avoidance_v_scale",        double_t, 0, "OVERTAKE dynamic avoidance vx multiplier (pending)", 1.0, 0.1, 2.0)
gen.add("static_avoidance_v_scale", double_t, 0, "OVERTAKE static avoidance vx multiplier (pending)",  1.0, 0.1, 2.0)
gen.add("start_v_scale",            double_t, 0, "START output vx_mps multiplier (pending)",           1.0, 0.1, 2.0)

## -- per-mode gg_scale (pending until apply) -----------------------
gen.add("recovery_gg_scale",         double_t, 0, "RECOVERY GGV ax/ay multiplier (pending)",         1.0, 0.1, 2.0)
gen.add("avoidance_gg_scale",        double_t, 0, "OVERTAKE dynamic avoidance GGV multiplier (pending)", 1.0, 0.1, 2.0)
gen.add("static_avoidance_gg_scale", double_t, 0, "OVERTAKE static avoidance GGV multiplier (pending)",  1.0, 0.1, 2.0)
gen.add("start_gg_scale",            double_t, 0, "START GGV ax/ay multiplier (pending)",            1.0, 0.1, 2.0)

## -- batch apply for all pending v_scale + gg_scale (auto-off) -----
gen.add("apply", bool_t, 0, "Commit ALL pending v_scale + gg_scale now (auto-off)", False)

## -- YAML save / load (auto-off) ----------------------------------
gen.add("save_param", bool_t, 0, "Save current FBGA params to map's fbga_tuner.yaml (auto-off)", False)
gen.add("load_param", bool_t, 0, "Load FBGA params from map's fbga_tuner.yaml (auto-off)",      False)

exit(gen.generate(PACKAGE, "state_machine", "FBGATuner"))
