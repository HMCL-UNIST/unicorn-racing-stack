#!/usr/bin/env python3
# Per-sector wall-margin tuner — clone of friction_sector_tuner's
# dyn_sect_tuner.cfg. Reads <pkg>/cfg/safety_sectors.yaml (copied here
# by the slicing GUI's finish_sector.sh) and emits N sliders
# (one per sector) + 1 global default slider. Each sector slider has
# its own safety_distance, pre_m, post_m. The global slider is the
# fallback applied outside any sector range.
#
#      Workflow:
#        1) RViz slicer marks sector positions  →  yaml gets new n_sectors
#        2) finish_sector.sh wipes generated Config and rebuilds the pkg
#        3) safety_sector_server.py restarts  →  rqt picks up new sliders
PACKAGE = "safety_sector_tuner_3d"
import rospkg
import yaml, os
from dynamic_reconfigure.parameter_generator_catkin import *

yaml_path = os.path.join(
    rospkg.RosPack().get_path('safety_sector_tuner_3d'),
    'cfg/safety_sectors.yaml')

gen = ParameterGenerator()
gen.add("save_params", bool_t, 1,
        "Save current slider values to <map>/safety_sectors.yaml + pkg cfg",
        False)
gen.add("load_yaml", bool_t, 1,
        "Reload sliders from <map>/safety_sectors.yaml",
        False)

if os.path.isfile(yaml_path):
    with open(yaml_path) as f:
        sector_dict = yaml.load(f, Loader=yaml.FullLoader)
else:
    sector_dict = {
        'safety_distance_default': 0.20,
        'n_sectors': 1,
        'Sector0': {'start': 0, 'end': 1,
                    'safety_distance': 0.20, 'pre_m': 0.0, 'post_m': 0.0},
    }

# global default — applied to grid points outside every sector range
# (gen_global_racing_line.py treats this as the legacy safety_distance
# fallback when the per-point sector lookup misses).
gen.add("safety_distance_default", double_t, 0,
        "Default wall margin [m] for grid points outside any sector range",
        float(sector_dict.get('safety_distance_default', 0.20)),
        0.0, 1.0)

only_sectors = {k: v for k, v in sector_dict.items() if k.startswith('Sector')}
for i, (key, item) in enumerate(only_sectors.items()):
    gen.add(f"Sector{i}", double_t, 0,
            "Sector {} wall margin [m] (idx {}–{})".format(
                i, item['start'], item['end']),
            float(item.get('safety_distance', 0.20)),
            0.0, 1.0)
    gen.add(f"Sector{i}_pre_m", double_t, 0,
            "Sector {} entry ramp length [m of s] "
            "(blend default → sector value)".format(i),
            float(item.get('pre_m', 0.0)),
            0.0, 5.0)
    gen.add(f"Sector{i}_post_m", double_t, 0,
            "Sector {} exit ramp length [m of s]".format(i),
            float(item.get('post_m', 0.0)),
            0.0, 5.0)

exit(gen.generate(PACKAGE, "safety_sector_tuner_3d", "dyn_safety_tuner"))
