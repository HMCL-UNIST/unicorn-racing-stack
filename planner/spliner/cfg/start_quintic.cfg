#!/usr/bin/env python3
# standalone test node for Frenet quintic d(s) start path.
PACKAGE = "spliner"
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Path generator mode — radio button in rqt.
mode_enum = gen.enum([
    gen.const("QUINTIC", int_t, 0, "Frenet quintic d(s) from ego, auto-target ahead by target_delta_s_m"),
    gen.const("POINTS",  int_t, 1, "BPoly through ego + RViz 2D Nav Goal clicks + nearest GB tail"),
], "Start path source")
gen.add("path_mode", int_t, 0, "Path generator mode", 0, 0, 1, edit_method=mode_enum)

# One-shot trigger: when checked, publishes the CURRENT path once on /planner/start_wpnts
# (OTWpntArray) so 3d_state_machine_node buffers it as cur_start_wpnts_candidate, then
# auto-resets to False. Frozen snapshot stays in state_machine until next trigger or until
# /save_start_traj commits it. Avoids continuous churn from ego micro-vibrations.
gen.add("snapshot_to_state_machine", bool_t, 0, "[TRIGGER] Send one snapshot to state_machine candidate (auto-resets)", False)

# if true (default), snapshot_to_state_machine also publishes /save_start_traj
# so the candidate is committed to START in the same tick. Set false to fall back to
# the legacy two-step flow (snapshot then manual save_start_traj from rqt).
gen.add("auto_commit_on_snapshot", bool_t, 0, "Also publish /save_start_traj on snapshot (skip manual commit)", True)

# trigger — publishes /abort_start_traj (Bool) once and auto-resets. state_machine
# clears cur_start_wpnts.is_init and, if currently in START, drops back to GB_TRACK.
gen.add("abort_start", bool_t, 0, "[TRIGGER] Abort START and clear buffered candidate (auto-resets)", False)

# yaml param persistence (per-car). Path resolved from racecar_version /
# CAR_NAME env; falls back to 'default' if neither is set. File auto-created with
# .cfg defaults on first run when missing.
gen.add("save_params", bool_t, 0, "[TRIGGER] Save current params to per-car yaml (auto-resets)", False)
gen.add("load_params", bool_t, 0, "[TRIGGER] Load params from per-car yaml (auto-resets)", False)

# -- QUINTIC mode params --
# Convergence horizon ahead of ego (RELATIVE Delta_s, NOT absolute s).
# s_target = (s_ego + target_delta_s_m) mod raceline_length.
gen.add("target_delta_s_m", double_t, 0, "[QUINTIC] Convergence horizon ahead of ego [m]", 5.0,  0.5, 30.0)
# Track edge margin used for feasibility check (path-side d(s) constraint).
gen.add("bound_margin_m",   double_t, 0, "Margin from track bounds [m]",                 0.15, 0.01, 1.0)
# Lateral accel budget for curvature feasibility, paired with assume_speed_mps.
gen.add("ay_max_mps2",      double_t, 0, "Lateral accel budget for kappa limit [m/s^2]", 4.0,  0.5, 12.0)
gen.add("assume_speed_mps", double_t, 0, "Reference speed for kappa limit [m/s]",        3.0,  0.5, 15.0)
# Sampling density of the published path.
gen.add("n_samples",        int_t,    0, "Number of samples along the path",             80,   10,  500)
# Minimum allowed convergence horizon to avoid degenerate quintics.
gen.add("min_delta_s_m",    double_t, 0, "Minimum delta_s = s_target - s_ego [m]",       1.0,  0.1, 10.0)
# If true, ignores ego heading and forces d'(s0) = 0 (debug aid).
gen.add("zero_start_slope", bool_t,   0, "Debug: force d'(s0)=0 (ignore heading)",       False)
# Optional straight prefix along current ego heading before the quintic kicks in.
gen.add("use_straight_prefix", bool_t,   0, "[QUINTIC] Prepend a straight segment along ego heading", False)
gen.add("straight_prefix_m",   double_t, 0, "[QUINTIC] Length of straight prefix [m]",       1.0, 0.0, 10.0)

# -- POINTS mode params (independent from QUINTIC) --
# Toggle that auto-resets to False after clearing the stored point list.
gen.add("clear_points",      bool_t,   0, "[POINTS] Clear collected click points (auto-resets)", False)
gen.add("spline_scale",      double_t, 0, "[POINTS] Tangent magnitude scale for BPoly",          0.8, 0.3, 2.0)
gen.add("points_tail_n",     int_t,    0, "[POINTS] Extra GB tail samples after last click",     40,  0,   200)
# Independent straight prefix for POINTS mode — does NOT share with QUINTIC's prefix toggle.
gen.add("points_use_straight_prefix", bool_t,   0, "[POINTS] Prepend straight segment along ego heading", False)
gen.add("points_straight_prefix_m",   double_t, 0, "[POINTS] Length of straight prefix [m]",              1.0, 0.0, 10.0)

exit(gen.generate(PACKAGE, "spliner_start_quintic", "start_quintic"))
